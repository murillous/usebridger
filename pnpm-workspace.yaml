packages:
  - packages/*
  - bench
  - site
  - examples/*
# Scripts de instalação dispensáveis: o do baileys só checa a versão do Node (o `engines` da raiz
# já cobre) e o do protobufjs só avisa sobre versões. Negados explicitamente, o install não pede
# aprovação.
allowBuilds:
  baileys: false
  protobufjs: false
# Versões do site (Astro) publicadas há menos que a idade mínima, mas necessárias para ele subir.
# Remover cada linha quando a versão passar da idade mínima.
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.13.0'
  - '@astrojs/markdown-satteri@0.4.4'
  - '@astrojs/prism@4.1.0'
  - '@astrojs/telemetry@3.4.0'
  - astro@7.4.0
patchedDependencies:
  starlight-llms-txt@0.12.0: patches/starlight-llms-txt@0.12.0.patch
